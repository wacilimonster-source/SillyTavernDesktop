name: 功能建议
description: 提出一个改进想法或新功能
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！请先搜索现有 Issue，描述使用场景比直接指定实现方式更有帮助。

  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 你现在的使用场景是什么？哪里不方便？
      placeholder: "例如：每次开机后都要手动打开浏览器……"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望程序如何工作？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 现在有没有临时做法？为什么不够好？
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 截图、相关链接或其他背景
    validations:
      required: false
