name: Bug 报告
description: 报告一个可复现的问题，帮助改进托盘管理器
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！提交前请先搜索现有 Issue，并确认日志中没有密钥、用户名等敏感信息。

  - type: input
    id: manager-version
    attributes:
      label: 管理器版本
      description: 主窗口标题栏或“设置”窗口底部显示的版本
      placeholder: "例如 v1.2.0"
    validations:
      required: true

  - type: input
    id: windows-version
    attributes:
      label: Windows 版本
      description: 在“设置 → 系统 → 关于”中查看
      placeholder: "例如 Windows 11 24H2 (26100.1742)"
    validations:
      required: true

  - type: input
    id: st-version
    attributes:
      label: SillyTavern 版本
      description: 管理窗口中显示的 ST 版本与分支
      placeholder: "例如 1.13.1 / release"
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 越具体越好，最好能从打开程序开始
      placeholder: |
        1. 打开管理器
        2. 点击……
        3. 看到……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: 日志位于 %LOCALAPPDATA%\SillyTavernTray\logs\。请粘贴相关片段，并先删除敏感信息。
      render: text
    validations:
      required: false

  - type: dropdown
    id: watchdog
    attributes:
      label: 是否开启看门狗
      options:
        - 开启（默认）
        - 关闭
        - 不确定
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue，没有找到相同问题
          required: true
        - label: 我已删除日志中的敏感信息
          required: true
