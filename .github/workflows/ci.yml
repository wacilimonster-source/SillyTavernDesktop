name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 同一分支的新提交会取消仍在跑的旧任务，节省队列时间。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build manager
        run: dotnet build SillyTavernTray.csproj -c Release
        shell: pwsh

      - name: Unit tests
        run: dotnet test tests/TrayUnitTests/TrayUnitTests.csproj -c Release
        shell: pwsh
